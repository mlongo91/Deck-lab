name: Refresh combo data

# Runs on GitHub's servers, where browser CORS rules don't apply.
# Downloads Commander Spellbook's published bulk data, strips it to a
# compact index, and commits it next to the app so the page can load it
# same-origin.

on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  schedule:
    - cron: "0 7 * * 1"     # every Monday, 07:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bulk combo data
        run: |
          set -e
          curl -sSL --retry 3 --retry-delay 5 \
            -H "User-Agent: commander-deck-lab/1.0" \
            -o variants.json.gz \
            https://json.commanderspellbook.com/variants.json.gz
          gunzip -f variants.json.gz
          ls -lh variants.json

      - name: Build combo index files
        run: |
          python3 - <<'PY'
          import json, os, datetime

          raw = json.load(open("variants.json"))
          variants = raw.get("variants", raw) if isinstance(raw, dict) else raw
          print("variants in feed:", len(variants))

          def card_names(v):
              out = []
              for u in v.get("uses") or []:
                  if isinstance(u, str):
                      out.append(u)
                  elif isinstance(u, dict):
                      c = u.get("card")
                      if isinstance(c, dict) and c.get("name"):
                          out.append(c["name"])
                      elif isinstance(c, str):
                          out.append(c)
                      elif u.get("cardName"):
                          out.append(u["cardName"])
                      elif u.get("name"):
                          out.append(u["name"])
              return out

          def features(v):
              out = []
              for p in v.get("produces") or []:
                  if isinstance(p, str):
                      out.append(p)
                  elif isinstance(p, dict):
                      f = p.get("feature")
                      if isinstance(f, dict) and f.get("name"):
                          out.append(f["name"])
                      elif p.get("name"):
                          out.append(p["name"])
              return out

          def commander_legal(v):
              leg = v.get("legalities") or {}
              val = leg.get("commander")
              if val is None:
                  return True
              if isinstance(val, bool):
                  return val
              return str(val).lower() in ("legal", "true")

          two, three = [], []
          for v in variants:
              if not commander_legal(v):
                  continue
              names = card_names(v)
              n = len(names)
              if n < 2 or n > 3:
                  continue
              row = [
                  v.get("id") or v.get("variantId") or "",
                  names,
                  ", ".join(features(v)[:2])[:70],
                  len(v.get("requires") or []),
              ]
              (two if n == 2 else three).append(row)

          print("2-card:", len(two), " 3-card:", len(three))

          def write(path, rows, note):
              payload = {
                  "generated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                  "source": "Commander Spellbook bulk data",
                  "count": len(rows),
                  "note": note,
                  "combos": rows,
              }
              with open(path, "w") as f:
                  json.dump(payload, f, separators=(",", ":"))
              mb = os.path.getsize(path) / 1e6
              print(path, round(mb, 2), "MB")
              return mb

          # loaded on every page view — keep it small
          write("combos.json", two, "two card combos, commander legal")

          # loaded only when the near-miss panel asks for it
          mb = write("combos3.json", three, "three card combos, commander legal")
          if mb > 8:
              for r in three:
                  r[2] = r[2][:28]
              mb = write("combos3.json", three, "three card combos, result text shortened for size")

          if len(two) < 500:
              raise SystemExit("suspiciously few two-card combos — refusing to commit")
          PY

      - name: Commit if changed
        run: |
          rm -f variants.json
          git config user.name "combo-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add combos.json combos3.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Refresh combo data $(date -u +%Y-%m-%d)"
            git push
          fi
