name: Fetch commander data

# Run this by hand whenever you start working on a new commander.
# Actions tab -> Fetch commander data -> Run workflow -> type the commander name.
# It pulls EDHREC's public JSON for that commander and commits a trimmed copy,
# so the app can read real synergy scores instead of guessing from card text.

on:
  workflow_dispatch:
    inputs:
      commander:
        description: 'Commander name (e.g. Zimone, Infinite Analyst)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and trim EDHREC data
        env:
          COMMANDER: ${{ inputs.commander }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, datetime

          name = os.environ["COMMANDER"].strip()
          slug = re.sub(r"[^a-z0-9\s-]", "", name.lower())
          slug = re.sub(r"\s+", "-", slug).strip("-")
          print("commander:", name, "-> slug:", slug)

          url = "https://json.edhrec.com/pages/commanders/%s.json" % slug
          print("fetching", url)
          req = urllib.request.Request(url, headers={"User-Agent": "commander-deck-lab/1.0"})
          try:
              raw = json.load(urllib.request.urlopen(req, timeout=60))
          except Exception as e:
              sys.exit("EDHREC fetch failed (%s). Check the commander spelling — the slug it tried was '%s'." % (e, slug))

          # Walk the whole document for card lists rather than assuming a shape,
          # so a change to their layout doesn't silently produce an empty file.
          found = {}
          def walk(node, header):
              if isinstance(node, dict):
                  h = node.get("header") or node.get("tag") or header
                  cv = node.get("cardviews")
                  if isinstance(cv, list):
                      for c in cv:
                          if not isinstance(c, dict):
                              continue
                          cname = c.get("name") or c.get("card_name")
                          if not cname:
                              continue
                          prev = found.get(cname)
                          entry = {
                              "name": cname,
                              "synergy": c.get("synergy"),
                              "decks": c.get("num_decks") or c.get("numDecks"),
                              "potential": c.get("potential_decks") or c.get("potentialDecks"),
                              "list": str(h or "")[:40],
                          }
                          # keep the entry carrying a synergy score if there are duplicates
                          if prev is None or (prev.get("synergy") is None and entry["synergy"] is not None):
                              found[cname] = entry
                  for k, v in node.items():
                      walk(v, node.get("header") or node.get("tag") or header)
              elif isinstance(node, list):
                  for v in node:
                      walk(v, header)

          walk(raw, None)
          cards = list(found.values())
          print("cards found:", len(cards))
          with_syn = [c for c in cards if isinstance(c.get("synergy"), (int, float))]
          print("with synergy scores:", len(with_syn))
          if len(cards) < 50:
              sys.exit("Too few cards parsed — EDHREC's format may have changed.")

          cards.sort(key=lambda c: (c.get("synergy") is None, -(c.get("synergy") or 0)))
          payload = {
              "commander": name,
              "slug": slug,
              "generated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "source": "EDHREC (json.edhrec.com)",
              "count": len(cards),
              "cards": [[c["name"], c["synergy"], c["decks"], c["list"]] for c in cards],
          }
          os.makedirs("edhrec", exist_ok=True)
          path = "edhrec/%s.json" % slug
          with open(path, "w") as f:
              json.dump(payload, f, separators=(",", ":"))
          print("wrote", path, round(os.path.getsize(path) / 1e6, 2), "MB")
          print("top synergy:", [c["name"] for c in cards[:8]])
          PY

      - name: Commit
        run: |
          git config user.name "edhrec-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add edhrec/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "EDHREC data: ${{ inputs.commander }}"
            git push
          fi
